name: Three-Graph Agent Safety Skill

on:
  pull_request:
    paths:
      - "skills/three-graph-agent-safety/**"
      - "scripts/build_three_graph_agent_safety_skill.py"
      - "skills/README.md"
      - ".github/workflows/publish-three-graph-agent-safety-skill.yml"
  push:
    branches:
      - main
    paths:
      - "skills/three-graph-agent-safety/**"
      - "scripts/build_three_graph_agent_safety_skill.py"
      - "skills/README.md"
      - ".github/workflows/publish-three-graph-agent-safety-skill.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and build deterministic skill ZIP
        run: python3 scripts/build_three_graph_agent_safety_skill.py
      - name: Verify ZIP and checksum
        run: |
          unzip -t dist/three-graph-agent-safety.zip
          cd dist
          sha256sum --check three-graph-agent-safety.zip.sha256
      - name: Compile and run semantic validator
        run: |
          python3 -m py_compile \
            skills/three-graph-agent-safety/tools/validate_personal_agent_safety_bundle.py \
            scripts/build_three_graph_agent_safety_skill.py
          python3 skills/three-graph-agent-safety/tools/validate_personal_agent_safety_bundle.py \
            skills/three-graph-agent-safety/assets/personal-agent-safety.example.json \
            --self-test
      - name: Validate JSON Schema syntax and compatibility
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("skills/three-graph-agent-safety/assets")
          legacy = json.loads((root / "three-graph-bundle.schema.json").read_text())
          v11 = json.loads((root / "personal-agent-safety-bundle.schema.json").read_text())
          v12 = json.loads((root / "personal-agent-safety-v1.2-bundle.schema.json").read_text())
          assert legacy["properties"]["profile"]["const"] == "org.proofpath.three-graph-agent-safety"
          assert v11["properties"]["version"]["const"] == "1.1.0"
          assert v12["properties"]["version"]["const"] == "1.2.0"
          required = set(v12["required"])
          assert {"identity_graph", "capability_graph", "temporal_graph"} <= required
          print("PASS: v1.0, v1.1, and v1.2 schemas are valid JSON")
          PY
      - name: Upload validated skill package
        uses: actions/upload-artifact@v4
        with:
          name: three-graph-agent-safety-skill-v1.2.0
          path: |
            dist/three-graph-agent-safety.zip
            dist/three-graph-agent-safety.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build release files
        run: python3 scripts/build_three_graph_agent_safety_skill.py
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: three-graph-agent-safety-v1.2.0
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/three-graph-agent-safety.zip \
              dist/three-graph-agent-safety.zip.sha256 \
              --clobber
          else
            gh release create "$TAG" \
              dist/three-graph-agent-safety.zip \
              dist/three-graph-agent-safety.zip.sha256 \
              --title "Three-Graph Agent Safety Skill v1.2.0" \
              --notes "Identity-Bound Agent Safety update: preserves the v1.0 and v1.1 contracts and adds separate Identity, Capability, and Temporal graphs; a v1.2 machine-readable bundle; 15 semantic negative controls; deterministic packaging; and Russian installation guidance."
          fi
