name: Refresh ProofPath SEO and SMM layer

on:
  push:
    branches: [main]
    paths:
      - .github/seo-smm-refresh.trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Improve product-first discovery and share assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          marker = "<!-- seo-product-intro:start -->"
          retained_marker = "**Verifiable intent for every critical action.**"

          if marker not in text:
              retained_index = text.find(retained_marker)
              if retained_index == -1:
                  raise SystemExit(f"Missing marker: {retained_marker}")

              intro = dedent(r'''
              <!-- seo-product-intro:start -->
              # ProofPath — AI Agent Authorization & Agentic Payment Security

              **A defensive pre-execution gateway for AI-agent security, agentic payments, verifiable intent, replay protection, human approval, and auditable action evidence.**

              > **Model output is a proposal, not authorization.**

              ProofPath asks one question before a high-risk action reaches a payment rail, API, infrastructure surface, or irreversible tool:

              > Should this exact action be allowed to execute now — under this intent, authority, scope, budget, recipient, approval, and replay state?

              ```text
              agent proposal
                    ↓
              exact intent + authority + policy + replay checks
                    ↓
              ACCEPT / HOLD / BLOCK
                    ↓
              tamper-evident audit record + portable evidence
              ```

              ## Product surfaces

              | Surface | What it protects |
              |---|---|
              | Agent Payment Guard | AI-initiated payments: asset, budget, recipient, approval, nonce, and evidence boundaries |
              | Pre-execution API gateway | High-risk API and tool actions before upstream execution |
              | CI evidence gate | Audit-log verification and pass/fail checks inside delivery workflows |
              | Personal Agent Guard | Local approval and evidence boundaries around AI coding tools |

              ## Fastest proof

              ```bash
              bash examples/agent-payment-guard/run_e2e_evidence_demo.sh
              bash examples/agent-payment-guard/run_mock_rail_demo.sh
              ```

              The demo proves that an accepted proposal reaches the mock rail, a replayed envelope is blocked, and the decision trail can be exported and verified offline.

              [Read the Agent Payment Guard brief](docs/agent-payment-guard-brief.md) · [Inspect the reviewer path](docs/REVIEWER_FIRST_SCREEN.md) · [Open architecture](docs/architecture.md)

              <details>
              <summary><strong>NGI TALER grant reviewer path</strong></summary>

              ProofPath Agent Payment Guard was submitted as an open-source auxiliary layer for privacy-preserving AI-agent payment authorization.

              - [Grant evidence index](docs/GRANT_EVIDENCE_INDEX.md)
              - [NGI TALER reviewer path](docs/NGI_TALER_REVIEWER_PATH.md)
              - [TALER alignment](docs/TALER_ALIGNMENT.md)
              - [Budget and milestones](docs/BUDGET_AND_MILESTONES.md)

              </details>
              <!-- seo-product-intro:end -->
              ''').strip()

              text = intro + "\n\n" + text[retained_index:]
              readme.write_text(text, encoding="utf-8")

          docs = Path("docs")
          docs.mkdir(exist_ok=True)
          social = dedent(r'''
          # ProofPath Social & Distribution Kit

          ## Canonical one-liner

          > ProofPath is a defensive pre-execution gateway that verifies exact intent, authority, policy, approval, and replay state before an AI-agent action can execute.

          ## Search intent

          Primary: AI agent security, AI agent authorization, agentic payment security, verifiable intent, pre-execution gateway.

          Secondary: runtime action governance, replay protection, human approval, policy engine, causal authorization, agent payment guard, evidence bundle.

          ## Short share copy

          ### LinkedIn

          A valid API key does not prove that an AI agent should execute this specific action now.

          ProofPath sits at the execution boundary and checks exact intent, authority, scope, budget, recipient, approval, expiry, and replay state before forwarding a high-risk action.

          The result is explicit — ACCEPT, HOLD, or BLOCK — with a tamper-evident audit record and portable evidence bundle.

          Repository: https://github.com/safal207/ProofPath

          ### X

          Authentication proves who can call.
          ProofPath asks whether this exact AI-agent action should execute now.

          Intent • scope • budget • recipient • approval • expiry • replay protection • evidence

          https://github.com/safal207/ProofPath

          ### Telegram / Russian

          ProofPath — защитный gateway перед исполнением действий AI-агента. Проверяет точный intent, authority, scope, budget, recipient, approval, expiry и replay state, а затем выдаёт ACCEPT / HOLD / BLOCK и сохраняет проверяемое доказательство решения.

          ## Reusable post formula

          ```text
          Authenticated request → missing action-level question → ProofPath decision → blocked/accepted effect → portable evidence
          ```

          ## Recommended GitHub metadata

          Description:

          > Pre-execution security gateway for AI-agent authorization, agentic payments, verifiable intent, replay protection, and audit evidence.

          Topics:

          `ai-agent-security`, `agentic-payments`, `verifiable-intent`, `action-governance`, `authorization`, `policy-engine`, `replay-protection`, `human-in-the-loop`, `api-security`, `audit-log`, `zero-trust`, `rust`
          ''').strip() + "\n"
          (docs / "SOCIAL_KIT.md").write_text(social, encoding="utf-8")

          citation = dedent(r'''
          cff-version: 1.2.0
          message: "If you use ProofPath in research or engineering work, please cite this repository."
          title: "ProofPath: Pre-Execution Authorization and Evidence for AI-Agent Actions"
          type: software
          authors:
            - family-names: "Safonov"
              given-names: "Aleksei"
          repository-code: "https://github.com/safal207/ProofPath"
          url: "https://github.com/safal207/ProofPath"
          license: "MIT"
          keywords:
            - AI agent security
            - agentic payments
            - verifiable intent
            - authorization
            - replay protection
            - audit evidence
          ''').strip() + "\n"
          Path("CITATION.cff").write_text(citation, encoding="utf-8")
          PY

          rm -f .github/seo-smm-refresh.trigger
          rm -f .github/workflows/seo-smm-refresh-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: improve ProofPath SEO and social discovery"
          git push
