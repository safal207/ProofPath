name: ProofPath Deploy Evidence Builder

on:
  pull_request:
    paths:
      - "deploy-guard/evidence-builder/**"
      - "deploy-guard/action.yml"
      - "deploy-guard/run_action.py"
      - "scripts/verify_proofpath_deploy_guard.py"
      - "examples/deploy-guard/trusted-facts.accept.json"
      - "examples/deploy-guard/evidence-builder-consumer-workflow.yml"
      - "examples/deploy-guard/deploy-policy.json"
      - "tests/test_deploy_evidence_builder.py"
      - "tests/test_deploy_evidence_builder_security.py"
      - ".github/workflows/proofpath-deploy-evidence-builder.yml"
      - "docs/PROOFPATH_DEPLOY_EVIDENCE_BUILDER.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-builder-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and run evidence-builder tests
        run: |
          set -euo pipefail
          python3 -m py_compile deploy-guard/evidence-builder/build_evidence.py
          python3 -m unittest \
            tests.test_deploy_evidence_builder \
            tests.test_deploy_evidence_builder_security \
            -v

      - name: Build deployment evidence through the local Action
        id: evidence
        uses: ./deploy-guard/evidence-builder
        with:
          policy: examples/deploy-guard/deploy-policy.json
          trusted-facts: examples/deploy-guard/trusted-facts.accept.json
          artifact-digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          environment: production
          agent-id: agent/cloud-deployer-01
          repository: safal207/ProofPath
          source-branch: main
          source-sha: 4444444444444444444444444444444444444444
          evaluated-at: 2026-08-01T18:00:00Z
          output: artifacts/evidence-builder/deploy-action-evidence.json

      - name: Evaluate generated evidence through Deploy Guard
        id: guard
        uses: ./deploy-guard
        with:
          policy: examples/deploy-guard/deploy-policy.json
          evidence: ${{ steps.evidence.outputs.evidence-path }}
          certificate: artifacts/evidence-builder/deploy-clearance.json
          mode: enforce

      - name: Verify builder and guard output binding
        env:
          BUILDER_ROOT: ${{ steps.evidence.outputs.evidence-root }}
          BUILDER_ACTION_ID: ${{ steps.evidence.outputs.action-id }}
          BUILDER_SOURCE_SHA: ${{ steps.evidence.outputs.source-sha }}
          GUARD_DECISION: ${{ steps.guard.outputs.decision }}
          GUARD_EVIDENCE_ROOT: ${{ steps.guard.outputs.evidence-root }}
          GUARD_AUTHORITY_GRANTED: ${{ steps.guard.outputs.authority-granted }}
        run: |
          set -euo pipefail
          test "$BUILDER_ROOT" = "$GUARD_EVIDENCE_ROOT"
          test "$BUILDER_SOURCE_SHA" = "4444444444444444444444444444444444444444"
          test -n "$BUILDER_ACTION_ID"
          test "$GUARD_DECISION" = "ACCEPT"
          test "$GUARD_AUTHORITY_GRANTED" = "false"

      - name: Build evidence-builder conformance manifest
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_SUBJECT_SHA: ${{ github.sha }}
          EVIDENCE_ROOT: ${{ steps.evidence.outputs.evidence-root }}
          ACTION_ID: ${{ steps.evidence.outputs.action-id }}
          CLEARANCE_ROOT: ${{ steps.guard.outputs.clearance-root }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          evidence = Path("artifacts/evidence-builder/deploy-action-evidence.json")
          certificate = Path("artifacts/evidence-builder/deploy-clearance.json")
          evidence_value = json.loads(evidence.read_text(encoding="utf-8"))
          certificate_value = json.loads(certificate.read_text(encoding="utf-8"))
          assert certificate_value["decision"] == "ACCEPT"
          assert certificate_value["evidence_root"] == os.environ["EVIDENCE_ROOT"]
          assert certificate_value["clearance_root"] == os.environ["CLEARANCE_ROOT"]
          assert certificate_value["authority_granted"] is False
          assert evidence_value["execution"]["performed"] is False
          manifest = {
              "profile_id": "proofpath.deploy.evidence-builder-conformance.v0.1",
              "source_sha": os.environ["SOURCE_SHA"],
              "workflow_subject_sha": os.environ["WORKFLOW_SUBJECT_SHA"],
              "action_id": os.environ["ACTION_ID"],
              "evidence_root": os.environ["EVIDENCE_ROOT"],
              "clearance_root": os.environ["CLEARANCE_ROOT"],
              "decision": "ACCEPT",
              "evidence_sha256": hashlib.sha256(evidence.read_bytes()).hexdigest(),
              "certificate_sha256": hashlib.sha256(certificate.read_bytes()).hexdigest(),
              "builder_verified_upstream_facts": False,
              "deployment_performed": False,
              "authority_granted": False,
          }
          Path("artifacts/evidence-builder-conformance-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Deploy Evidence Builder evidence
        uses: actions/upload-artifact@v4
        with:
          name: proofpath-deploy-evidence-builder-${{ github.run_id }}
          path: |
            artifacts/evidence-builder
            artifacts/evidence-builder-conformance-manifest.json
            deploy-guard/evidence-builder/action.yml
            deploy-guard/evidence-builder/build_evidence.py
            examples/deploy-guard/trusted-facts.accept.json
            examples/deploy-guard/evidence-builder-consumer-workflow.yml
            docs/PROOFPATH_DEPLOY_EVIDENCE_BUILDER.md
          if-no-files-found: error
          retention-days: 14
