name: Agent Authorization ASB-02

on:
  pull_request:
    paths:
      - "examples/authorization-revocation-guard/**"
      - "scripts/finalize_asb02_evidence.py"
      - "scripts/check_authorization_record_export.py"
      - "scripts/verify_authorization_record_export.py"
      - ".github/workflows/agent-authorization-asb02.yml"
  push:
    branches: [main]
    paths:
      - "examples/authorization-revocation-guard/**"
      - "scripts/finalize_asb02_evidence.py"
      - "scripts/check_authorization_record_export.py"
      - "scripts/verify_authorization_record_export.py"
      - ".github/workflows/agent-authorization-asb02.yml"

permissions:
  contents: read

jobs:
  revoked-before-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CML_AGENT_SAFETY_REF: 872b3f8012447e7bfc1652e4cb696a32758c579d
    steps:
      - name: Checkout ProofPath
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned CML verifier
        uses: actions/checkout@v4
        with:
          repository: safal207/Causal-Memory-Layer
          ref: ${{ env.CML_AGENT_SAFETY_REF }}
          path: .cml-verifier
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CML runtime dependencies
        run: python -m pip install --disable-pip-version-check ./.cml-verifier
      - name: Validate scripts
        run: |
          python -m py_compile \
            examples/authorization-revocation-guard/revocation_guard_demo.py \
            scripts/finalize_asb02_evidence.py \
            .cml-verifier/scripts/run_agent_safety_benchmark.py
          bash -n examples/authorization-revocation-guard/run_revocation_before_dispatch_verified_demo.sh
          bash -n examples/authorization-revocation-guard/run_cml_asb02_verified_check.sh
      - name: Run authorization-record regressions
        run: |
          python3 scripts/check_authorization_record_export.py
          python3 scripts/verify_authorization_record_export.py
      - name: Run ASB-02 through pinned CML scorer
        env:
          CML_ROOT: .cml-verifier
          CML_EXPECTED_COMMIT: ${{ env.CML_AGENT_SAFETY_REF }}
        run: bash examples/authorization-revocation-guard/run_cml_asb02_verified_check.sh
      - name: Verify evidence checksums
        run: |
          cd proofpath-asb02-evidence-bundle
          sha256sum --check SHA256SUMS
      - name: Upload scored evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: proofpath-asb02-cml-${{ github.sha }}
          path: proofpath-asb02-evidence-bundle/
          if-no-files-found: error
          retention-days: 14
