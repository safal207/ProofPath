name: PoCI External Witness SDK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/poci-external-witness-sdk.yml"
      - "sdk/proofpath_external_witness.py"
      - "schemas/poci-external-operator-response-v0.1.schema.json"
      - "examples/poci-witness/external-operator/**"
      - "tests/test_external_witness_sdk.py"
      - "docs/POCI_EXTERNAL_WITNESS_SDK.md"
  pull_request:
    paths:
      - ".github/workflows/poci-external-witness-sdk.yml"
      - "sdk/proofpath_external_witness.py"
      - "schemas/poci-external-operator-response-v0.1.schema.json"
      - "examples/poci-witness/external-operator/**"
      - "tests/test_external_witness_sdk.py"
      - "docs/POCI_EXTERNAL_WITNESS_SDK.md"

concurrency:
  group: poci-external-witness-sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-conformance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and run SDK conformance tests
        run: |
          python3 -m py_compile sdk/proofpath_external_witness.py
          python3 -m unittest tests.test_external_witness_sdk -v

      - name: Verify exact challenge fixture
        run: |
          python3 sdk/proofpath_external_witness.py verify-challenge \
            examples/poci-witness/external-operator/challenge.json

      - name: Recompute the live six-graph transition space
        run: |
          mkdir -p artifacts
          python3 scripts/build_poci_multigraph.py \
            examples/poci-witness/multigraph/source.valid.json \
            --pretty \
            --output artifacts/recomputed-multigraph.json

      - name: Verify pinned ProofPath producer attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify \
            examples/poci-witness/federation/proofpath-attested-quorum-report.json \
            --repo "safal207/ProofPath" \
            --signer-workflow "safal207/ProofPath/.github/workflows/poci-signed-witness-network.yml" \
            --source-digest "3a5dde912c44e0957204d3df733e712c596455f1" \
            --signer-digest "3a5dde912c44e0957204d3df733e712c596455f1" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            --deny-self-hosted-runners \
            --format json \
            > artifacts/producer-attestation.json

      - name: Prove same-owner run remains HOLD
        run: |
          set +e
          python3 sdk/proofpath_external_witness.py create-response \
            examples/poci-witness/external-operator/challenge.json \
            artifacts/recomputed-multigraph.json \
            --domain-id "same-owner-conformance" \
            --repository "$GITHUB_REPOSITORY" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --workflow "$GITHUB_REPOSITORY/.github/workflows/poci-external-witness-sdk.yml" \
            --producer-code-sha "646f5c63795fc7338c3206db1d40aceec4c8a1de" \
            --source-path "examples/poci-witness/multigraph/source.valid.json" \
            --source-file examples/poci-witness/multigraph/source.valid.json \
            --producer-attestation-result artifacts/producer-attestation.json \
            --producer-attestation-verified \
            --output artifacts/same-owner-response.json
          status=$?
          set -e
          test "$status" -eq 2
          python3 - <<'PY'
          import json
          from pathlib import Path

          response = json.loads(
              Path("artifacts/same-owner-response.json").read_text(encoding="utf-8")
          )
          assert response["decision"] == "HOLD"
          assert response["reason_codes"] == ["OPERATOR_OWNER_NOT_INDEPENDENT"]
          assert response["claims_organizational_independence"] is False
          assert response["authority_granted"] is False
          assert len(response["consensus"]["graph_roots"]) == 6
          print("PASS same-owner SDK run remains honest HOLD")
          PY

      - name: Build deterministic SDK kit manifest
        run: |
          mkdir -p artifacts/kit/proofpath-witness
          cp sdk/proofpath_external_witness.py \
            artifacts/kit/proofpath-witness/proofpath_external_witness.py
          cp examples/poci-witness/external-operator/challenge.json \
            artifacts/kit/proofpath-witness/challenge.json
          cp examples/poci-witness/external-operator/reference-workflow.yml \
            artifacts/kit/proofpath-external-witness.yml
          cp schemas/poci-external-operator-response-v0.1.schema.json \
            artifacts/kit/poci-external-operator-response-v0.1.schema.json
          cp docs/POCI_EXTERNAL_WITNESS_SDK.md artifacts/kit/README.md
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("artifacts/kit")
          files = {}
          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              relative = path.relative_to(root).as_posix()
              files[relative] = "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
          manifest = {
              "profile_id": "proofpath.poci.external-witness-sdk-kit.v0.1",
              "challenge_root": "sha256:02f8118f2f5ff7465409ec513da5d0474e26ec8d7c469c5e06ed181f02a82c20",
              "producer_code_sha": "646f5c63795fc7338c3206db1d40aceec4c8a1de",
              "files": files,
              "file_count": len(files),
              "authority_granted": False,
              "kit_root": None,
          }
          normalized = json.dumps(
              manifest,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          manifest["kit_root"] = "sha256:" + hashlib.sha256(
              b"proofpath:poci:external-witness-sdk-kit:v0.1\n" + normalized
          ).hexdigest()
          output = Path("artifacts/sdk-kit-manifest.json")
          output.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          assert manifest["file_count"] == 5
          print("PASS external witness SDK kit manifest")
          PY

      - name: Keyless-attest SDK kit manifest
        uses: actions/attest@v4
        with:
          subject-path: artifacts/sdk-kit-manifest.json

      - name: Upload SDK evidence and distributable kit
        uses: actions/upload-artifact@v4
        with:
          name: poci-external-witness-sdk-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14
