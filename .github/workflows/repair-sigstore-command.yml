name: Repair Sigstore Command Contract

on:
  pull_request:
    branches:
      - agent/proofpath-control-cloud-ingestion-api-v0.1

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'safal207/ProofPath' && github.actor == 'safal207'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/proofpath-sigstore-admission-verifier-v0.1
          fetch-depth: 0
      - name: Apply mutually-exclusive identity flag correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('control-cloud/admission/verify_sigstore.py'): [
                  (
                      '        "--signer-repo",\n        policy["signer_repository"],\n        "--signer-workflow",',
                      '        "--signer-workflow",',
                  ),
              ],
              Path('tests/test_sigstore_admission.py'): [
                  (
                      '            "--repo", "--signer-repo", "--signer-workflow", "--source-digest",',
                      '            "--repo", "--signer-workflow", "--source-digest",',
                  ),
              ],
              Path('tests/test_sigstore_admission_security.py'): [
                  ('            \'"--signer-repo"\',\n', ''),
              ],
              Path('control-cloud/admission/README.md'): [
                  (
                      '- the signer repository;\n- the exact signer workflow path;',
                      '- the exact signer workflow identity, which also binds its repository;',
                  ),
                  ('  --signer-repo OWNER/REPOSITORY \\\n', ''),
              ],
          }

          changed = False
          for path, rules in replacements.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in rules:
                  count = text.count(old)
                  if count == 0:
                      continue
                  if count != 1:
                      raise SystemExit(f'unexpected replacement count for {path}: {count}')
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed = True

          verifier = Path('control-cloud/admission/verify_sigstore.py').read_text(encoding='utf-8')
          if '"--signer-repo"' in verifier:
              raise SystemExit('mutually exclusive --signer-repo flag remains')
          if '"--signer-workflow"' not in verifier:
              raise SystemExit('exact signer workflow pin was lost')
          if not changed:
              print('Command contract already corrected.')
          PY
          find control-cloud tests -type d -name __pycache__ -prune -exec rm -rf {} +
          python3 -m unittest \
            tests.test_sigstore_admission \
            tests.test_admitted_ingestion \
            tests.test_sigstore_admission_security \
            -v
          find control-cloud tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'proofpath-bot'
          git config user.email '55020240+safal207@users.noreply.github.com'
          git add \
            control-cloud/admission/verify_sigstore.py \
            control-cloud/admission/README.md \
            tests/test_sigstore_admission.py \
            tests/test_sigstore_admission_security.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit -m 'fix: use exact signer workflow identity'
          git push origin HEAD:agent/proofpath-sigstore-admission-verifier-v0.1
