name: PoCI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/poci.yml"
      - "docs/POCI_*.md"
      - "docs/THREAT_MODEL_POCI.md"
      - "schemas/action-proof-envelope.v0.1.schema.json"
      - "examples/poci-witness/**"
      - "scripts/verify_poci.py"
      - "scripts/build_poci_multigraph.py"
      - "scripts/run_poci_multigraph_witness.py"
      - "scripts/verify_poci_multigraph_quorum.py"
      - "tests/test_poci*.py"
      - "crates/proofpath-verifier/src/poci.rs"
      - "crates/proofpath-verifier/src/bin/proofpath-poci.rs"
  pull_request:
    paths:
      - ".github/workflows/poci.yml"
      - "docs/POCI_*.md"
      - "docs/THREAT_MODEL_POCI.md"
      - "schemas/action-proof-envelope.v0.1.schema.json"
      - "examples/poci-witness/**"
      - "scripts/verify_poci.py"
      - "scripts/build_poci_multigraph.py"
      - "scripts/run_poci_multigraph_witness.py"
      - "scripts/verify_poci_multigraph_quorum.py"
      - "tests/test_poci*.py"
      - "crates/proofpath-verifier/src/poci.rs"
      - "crates/proofpath-verifier/src/bin/proofpath-poci.rs"

permissions:
  contents: read

concurrency:
  group: poci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Guard fixture corpus
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("examples/poci-witness/fixtures")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          cases = manifest.get("cases")
          if not isinstance(cases, list) or len(cases) != 12:
              raise SystemExit("PoCI manifest must contain exactly 12 cases")
          names = [case.get("file") for case in cases]
          if len(names) != len(set(names)):
              raise SystemExit("PoCI manifest contains duplicate fixture names")
          files = sorted(path.name for path in root.glob("*.json") if path.name != "manifest.json")
          if sorted(names) != files:
              raise SystemExit(f"fixture corpus drift: manifest={sorted(names)!r}, files={files!r}")
          print(f"PASS PoCI fixture corpus guard ({len(files)} fixtures)")
          PY

      - name: Compile Python entrypoints
        run: |
          python3 -m py_compile \
            scripts/verify_poci.py \
            scripts/build_poci_multigraph.py \
            scripts/run_poci_multigraph_witness.py \
            scripts/verify_poci_multigraph_quorum.py \
            examples/poci-witness/run_demo.py \
            tests/test_poci_conformance.py \
            tests/test_poci_demo.py \
            tests/test_poci_multigraph.py \
            tests/test_poci_multigraph_witness.py

      - name: Run Python PoCI tests
        run: python3 -m unittest discover -s tests -p 'test_poci*.py' -v

      - name: Run Rust PoCI tests
        run: cargo test -p proofpath-verifier poci --all-targets

      - name: Generate Python conformance report
        run: |
          mkdir -p artifacts/poci/conformance
          python3 scripts/verify_poci.py \
            examples/poci-witness/fixtures/manifest.json \
            --manifest --pretty \
            > artifacts/poci/conformance/python-conformance-report.json

      - name: Generate Rust conformance report
        run: |
          cargo run -q -p proofpath-verifier \
            --bin proofpath-poci -- \
            examples/poci-witness/fixtures/manifest.json \
            --manifest --pretty \
            > artifacts/poci/conformance/rust-conformance-report.json

      - name: Compare Python and Rust decisions and roots
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/poci/conformance")
          python_report = json.loads(
              (root / "python-conformance-report.json").read_text(encoding="utf-8")
          )
          rust_report = json.loads(
              (root / "rust-conformance-report.json").read_text(encoding="utf-8")
          )

          for name, report in (("python", python_report), ("rust", rust_report)):
              if report.get("passed") is not True or report.get("case_count") != 12:
                  raise SystemExit(f"{name} report is not passing all 12 cases")

          python_cases = {case["file"]: case for case in python_report["cases"]}
          rust_cases = {case["file"]: case for case in rust_report["cases"]}
          if python_cases.keys() != rust_cases.keys():
              raise SystemExit("Python and Rust fixture sets differ")

          compared = []
          for filename in sorted(python_cases):
              left = python_cases[filename]
              right = rust_cases[filename]
              fields = (
                  "actual_decision",
                  "actual_primary_reason_code",
                  "computed_envelope_root",
              )
              for field in fields:
                  if left.get(field) != right.get(field):
                      raise SystemExit(
                          f"PoCI parity mismatch for {filename} {field}: "
                          f"python={left.get(field)!r} rust={right.get(field)!r}"
                      )
              compared.append(
                  {
                      "file": filename,
                      "decision": left["actual_decision"],
                      "primary_reason_code": left["actual_primary_reason_code"],
                      "computed_envelope_root": left["computed_envelope_root"],
                  }
              )

          parity = {
              "profile_id": python_report.get("profile_id"),
              "case_count": len(compared),
              "passed": True,
              "implementations": ["python", "rust"],
              "cases": compared,
          }
          (root / "python-rust-parity-report.json").write_text(
              json.dumps(parity, indent=2) + "\n",
              encoding="utf-8",
          )
          print("PASS Python/Rust PoCI parity (12 fixtures)")
          PY

      - name: Generate multi-graph transition report
        run: |
          mkdir -p artifacts/poci/multigraph
          python3 scripts/build_poci_multigraph.py \
            examples/poci-witness/multigraph/source.valid.json \
            --pretty \
            --output artifacts/poci/multigraph/multigraph-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("artifacts/poci/multigraph/multigraph-report.json").read_text(
                  encoding="utf-8"
              )
          )
          if report.get("decision") != "ACCEPT":
              raise SystemExit("PoCI multi-graph report did not ACCEPT")
          if len(report.get("graphs", {})) != 6:
              raise SystemExit("PoCI multi-graph report must contain six graphs")
          if len(report.get("transition_cells", [])) != 3:
              raise SystemExit("PoCI multi-graph report must contain three cells")
          print("PASS PoCI multi-graph transition space (6 graphs, 3 cells)")
          PY

      - name: Run isolated multi-graph witness quorum
        run: |
          mkdir -p artifacts/poci/multigraph/witness-statements
          python3 scripts/verify_poci_multigraph_quorum.py \
            examples/poci-witness/multigraph/witnesses.json \
            --pretty \
            --statements-dir artifacts/poci/multigraph/witness-statements \
            --output artifacts/poci/multigraph/witness-quorum-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("artifacts/poci/multigraph/witness-quorum-report.json").read_text(
                  encoding="utf-8"
              )
          )
          if report.get("decision") != "ACCEPT":
              raise SystemExit("PoCI witness quorum did not ACCEPT")
          if report.get("quorum") != 2:
              raise SystemExit("PoCI witness quorum must require two witnesses")
          if report.get("configured_witness_count") != 3:
              raise SystemExit("PoCI witness set must contain three processes")
          if len(report.get("agreeing_witnesses", [])) < 2:
              raise SystemExit("PoCI witness quorum did not reach 2-of-3")
          consensus = report.get("consensus") or {}
          if len(consensus.get("graph_roots", {})) != 6:
              raise SystemExit("PoCI witness consensus must commit six graph roots")
          statement_files = sorted(
              path.name
              for path in Path(
                  "artifacts/poci/multigraph/witness-statements"
              ).glob("*.json")
          )
          if statement_files != [
              "witness-alpha.json",
              "witness-beta.json",
              "witness-gamma.json",
          ]:
              raise SystemExit(
                  f"unexpected PoCI witness statements: {statement_files!r}"
              )
          print("PASS PoCI isolated witness quorum (2-of-3, six graph roots)")
          PY

      - name: Run reviewer demo
        run: |
          mkdir -p artifacts/poci/demo
          python3 examples/poci-witness/run_demo.py \
            --output-dir artifacts/poci/demo \
            --check \
            | tee artifacts/poci/demo-transcript.txt

      - name: Upload PoCI evidence reports
        uses: actions/upload-artifact@v4
        with:
          name: poci-conformance-${{ github.run_id }}
          path: artifacts/poci
          if-no-files-found: error
          retention-days: 14
