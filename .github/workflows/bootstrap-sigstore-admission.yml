name: Bootstrap Sigstore Admission

on:
  pull_request:
    branches:
      - agent/proofpath-control-cloud-ingestion-api-v0.1

permissions:
  contents: write

jobs:
  install-reviewed-package:
    if: github.repository == 'safal207/ProofPath' && github.actor == 'safal207'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/proofpath-sigstore-admission-verifier-v0.1
          fetch-depth: 0

      - name: Verify, install, and self-remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/sigstore-admission/part* > /tmp/proofpath-payload.b64
          test "$(sha256sum /tmp/proofpath-payload.b64 | cut -d' ' -f1)" = "18a0273f7e7042322f2cd81bd153b277374fb18b3631ee1577d830bac24df711"
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import pathlib
          import tarfile

          encoded = pathlib.Path('/tmp/proofpath-payload.b64').read_bytes()
          payload = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(payload).hexdigest() != '99d3000d0399b482818ce3e68d48b5b1e261fe8719094b4041a9c36be4efeb9e':
              raise SystemExit('decoded payload digest mismatch')

          expected = {
              '.github/workflows/proofpath-sigstore-admission.yml',
              'control-cloud/admission/verify_sigstore.py',
              'control-cloud/admission/README.md',
              'control-cloud/ingestion/admitted_ingest.py',
              'schemas/proofpath-control-cloud-sigstore-admission-policy-v0.1.schema.json',
              'schemas/proofpath-control-cloud-sigstore-admission-result-v0.1.schema.json',
              'schemas/proofpath-control-cloud-admitted-ingest-receipt-v0.1.schema.json',
              'tests/test_sigstore_admission.py',
              'tests/test_admitted_ingestion.py',
              'tests/test_sigstore_admission_security.py',
          }
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              members = archive.getmembers()
              names = {member.name for member in members}
              if names != expected:
                  raise SystemExit(f'unexpected payload paths: {sorted(names ^ expected)}')
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if not member.isfile() or path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe payload member: {member.name}')
              archive.extractall('.')
          PY

          rm -rf .bootstrap
          rm .github/workflows/bootstrap-sigstore-admission.yml
          python3 -m py_compile control-cloud/admission/verify_sigstore.py control-cloud/ingestion/admitted_ingest.py
          python3 -m unittest tests.test_sigstore_admission tests.test_admitted_ingestion tests.test_sigstore_admission_security -v
          git config user.name 'proofpath-bot'
          git config user.email '55020240+safal207@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add Sigstore admission verifier'
          git push origin HEAD:agent/proofpath-sigstore-admission-verifier-v0.1
