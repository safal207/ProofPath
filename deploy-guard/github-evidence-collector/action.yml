name: ProofPath GitHub Evidence Collector

description: Collect commit-bound GitHub checks, reviews, workflow, and artifact facts for Deploy Guard.

author: safal207

inputs:
  github-token:
    description: GitHub token with actions:read, checks:read, contents:read, and pull-requests:read as needed.
    required: true
  policy:
    description: Deploy Guard policy whose required_checks determine which check runs are collected.
    required: true
  governance-facts:
    description: Explicit authority, vulnerability, and change-ticket facts that GitHub cannot infer.
    required: true
  approval-role-map:
    description: Explicit GitHub-login to business-role mapping for PR approvals.
    required: true
  run-id:
    description: Artifact-producing GitHub Actions run ID.
    required: true
  artifact-name:
    description: Exact GitHub Actions artifact name.
    required: true
  source-sha:
    description: Exact source commit whose run, checks, reviews, and artifact are collected.
    required: true
  pull-request-number:
    description: Optional PR number used to collect commit-bound approvals.
    required: false
    default: ""
  attestation-result:
    description: Optional bound result from a separate pinned attestation verifier.
    required: false
    default: ""
  repository:
    description: Source repository in owner/name form. Defaults to GITHUB_REPOSITORY.
    required: false
    default: ""
  allow-current-run:
    description: Allow the current in-progress run after an earlier job uploaded the artifact.
    required: false
    default: "false"
  output:
    description: Path for the generated trusted-facts JSON.
    required: false
    default: proofpath-evidence/github-trusted-facts.json

outputs:
  trusted-facts-path:
    description: Absolute path to the generated trusted-facts JSON.
    value: ${{ steps.collect.outputs.trusted-facts-path }}
  collector-root:
    description: Domain-separated root of collector metadata and generated facts.
    value: ${{ steps.collect.outputs.collector-root }}
  artifact-id:
    description: Exact GitHub Actions artifact ID.
    value: ${{ steps.collect.outputs.artifact-id }}
  artifact-digest:
    description: GitHub Actions artifact archive digest.
    value: ${{ steps.collect.outputs.artifact-digest }}
  workflow:
    description: Artifact-producing workflow identity.
    value: ${{ steps.collect.outputs.workflow }}
  source-sha:
    description: Commit bound into all collected GitHub-native facts.
    value: ${{ steps.collect.outputs.source-sha }}
  pull-request-number:
    description: PR number used for review collection, when supplied.
    value: ${{ steps.collect.outputs.pull-request-number }}
  check-count:
    description: Number of required check runs collected.
    value: ${{ steps.collect.outputs.check-count }}
  approval-count:
    description: Number of mapped, latest, exact-commit approvals collected.
    value: ${{ steps.collect.outputs.approval-count }}

runs:
  using: composite
  steps:
    - name: Collect commit-bound GitHub evidence
      id: collect
      shell: bash
      env:
        PROOFPATH_GITHUB_TOKEN: ${{ inputs.github-token }}
        PROOFPATH_POLICY: ${{ inputs.policy }}
        PROOFPATH_GOVERNANCE_FACTS: ${{ inputs.governance-facts }}
        PROOFPATH_APPROVAL_ROLE_MAP: ${{ inputs.approval-role-map }}
        PROOFPATH_RUN_ID: ${{ inputs.run-id }}
        PROOFPATH_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        PROOFPATH_SOURCE_SHA: ${{ inputs.source-sha }}
        PROOFPATH_PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number }}
        PROOFPATH_ATTESTATION_RESULT: ${{ inputs.attestation-result }}
        PROOFPATH_REPOSITORY: ${{ inputs.repository }}
        PROOFPATH_ALLOW_CURRENT_RUN: ${{ inputs.allow-current-run }}
        PROOFPATH_OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/collect_github_evidence.py"
